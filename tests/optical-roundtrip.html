<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JamScan optical round-trip test</title>
  <script src="../assets/js/fountain.js"></script>
  <script src="../assets/js/core.js"></script>
</head>
<body>
  <pre id="result">RUNNING</pre>
  <script>
    (async () => {
      const result = document.getElementById("result");

      try {
        const core = window.JamScanCore;
        const payload = core.textEncoder.encode("JamScan optical test data ".repeat(50));
        const built = await core.buildPackage(payload, "test.txt", "text/plain");
        const stream = core.createStream(built.bytes);
        const frames = [0, 1, 2, 3].map(sequence => core.createFountainFrame(stream, sequence));
        const source = document.createElement("canvas");
        source.width = 960;
        source.height = 960;
        core.renderFrameGrid(source, frames);

        const camera = document.createElement("canvas");
        camera.width = 640;
        camera.height = 480;
        const context = camera.getContext("2d");
        context.fillStyle = "#d8d8d8";
        context.fillRect(0, 0, camera.width, camera.height);
        context.drawImage(source, 105, 25, 430, 430);

        const decoded = core.sampleFramesFromCanvas(camera, [], 4);
        const sequences = new Set(decoded.map(frame => frame.sequence));
        for (const frame of frames) {
          if (!sequences.has(frame.sequence)) throw new Error(`Missing sequence ${frame.sequence}`);
        }

        result.textContent = `PASS decoded ${decoded.length} codes from one image\nALL TESTS PASSED`;
        document.title = "PASS";
      } catch (error) {
        result.textContent = `FAIL\n${error.stack || error.message}`;
        document.title = "FAIL";
      }
    })();
  </script>
</body>
</html>
