<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <title>Open .jscan - JamScan</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../">JamScan</a>
    <nav class="nav">
      <a href="../">Home</a>
      <a href="../quick/send/">Quick Send</a>
      <a href="../quick/receive/">Quick Receive</a>
      <a href="../send/">Optical Send</a>
      <a href="../receive/">Optical Receive</a>
      <a class="active" href="./">Open .jscan</a>
    </nav>
  </header>
  <main class="page">
    <section class="card camera-card">
      <h1 style="font-size:clamp(2.4rem,7vw,5rem)">Open .jscan</h1>
      <p class="muted">Verify a saved JamScan package before viewing or downloading its content.</p>
      <div class="field">
        <label for="jscan-input">JamScan file</label>
        <input id="jscan-input" type="file" accept=".jscan,application/x-jamscan">
      </div>
      <div id="open-status" class="status">No package selected.</div>
      <div id="open-result" class="preview"></div>
    </section>
  </main>
  <footer>Unknown file types are never executed inside JamScan.</footer>
  <script type="module" src="../src/open.js"></script>
</body>
</html>
